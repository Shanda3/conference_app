  <title id="title">Organizer-marked northwest courtyard reference</title>
  <desc id="description">A simplified perspective diagram of the Oklahoma City Convention Center based on the organizer's marked photograph. The pink outline preserves the marked courtyard below the left front glass facade. It represents the northwest courtyard identified by the organizer. No food-truck parking position or compass projection is inferred.</desc>
